# CI == `make check` (Tauri 2 stack, docs/adr/0001-stack.md). Action versions were not re-checked; pin to commit SHAs
# before release.
name: ci
on:
  pull_request:
  push:
    branches: ["**"] # phase-0, main and every feature branch run the full check (human, 2026-10-26)

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hard-rule static scan
        run: scripts/ci/compliance-scan.sh
      - name: Compliance self-test (scan + hooks + crate boundary reject seeded violations)
        run: tests/compliance/selftest.sh
      - name: Validate JSON configs
        run: |
          jq empty .claude/settings.json .mcp.json
          jq -e '.productName == "Harness" and .identifier == "dev.local.harness"' src-tauri/tauri.conf.json
          jq -e '(.permissions | index("core:default")) != null' src-tauri/capabilities/main.json
      - name: Lint shell scripts
        run: |
          shellcheck -S warning .claude/hooks/*.sh scripts/ci/*.sh tests/compliance/*.sh
          find spike -name '*.sh' -print0 | xargs -0 shellcheck -S warning

  stack:
    needs: compliance
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: make check
        run: make check

  # Release builds: notarized Developer ID, outside the Mac App Store (App Sandbox breaks child CLIs; hard rule 4).
