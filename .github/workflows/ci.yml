# Sample CI. The compliance job runs today; the macOS stack job is a TODO until docs/adr/0001-stack.md exists.
# Action versions are the ones in the research Page (Oct 2026) and were not re-checked; pin to commit SHAs before release.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hard-rule static scan
        run: scripts/ci/compliance-scan.sh
      - name: Compliance self-test (scan + hooks reject seeded violations)
        run: tests/compliance/selftest.sh
      - name: Validate JSON configs
        run: |
          jq empty .claude/settings.json .mcp.json
      - name: Lint shell scripts
        run: |
          shellcheck -S warning .claude/hooks/*.sh scripts/ci/*.sh tests/compliance/*.sh spike/lib/common.sh spike/preflight.sh spike/handoff/parse.sh spike/plan/hash.sh spike/tests/test_common.sh spike/tests/test_preflight.sh spike/tests/test_handoff.sh spike/tests/test_plan.sh

  stack:
    needs: compliance
    runs-on: macos-latest
    # TODO(stack): replace these steps with ONE of the blocks below after the stack ADR.
    steps:
      - uses: actions/checkout@v4
      - name: Checks (auto-detects stack; compliance-only until app code exists)
        run: make check

