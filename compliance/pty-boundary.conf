# Sourced by scripts/ci/compliance-scan.sh (hard rule 3). Tauri layout since T-101.
# Symbols: the PTY write command and its TS port, the pty-view crate (by either spelling) and the UI port module.
# Paths: scheduler/lead/orchestrator code anywhere (incl. src/features/lead/) and everything in the harness-core crate,
# including its Cargo.toml, so the core can never name the PTY crate even in a comment or manifest.
PTY_SYMBOLS_RE='(pty_write|write_to_pty|PtyWriter|ptyWrite|writeToPty|pty_view|pty-view|pty-input)'
PTY_DIRS_RE='(^|/)(scheduler|lead|orchestrator|harness-core)(/|\.)'
