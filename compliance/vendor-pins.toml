# Compiled trust policy, not user configuration. No trust-on-first-use pins.
# Apple certifies the Developer ID organization; require that chain, the legal
# vendor identity and the specific CLI identifier. Both installed native CLIs
# use hardened runtime. Never accept a shell/npm interpreter shim on this lane.
# Anthropic's published platform signer: https://code.claude.com/docs/en/setup#platform-code-signatures
# OpenAI's published team: https://github.com/openai/codex/blob/main/codex-rs/cli/src/desktop_app/mac.rs
# Release hashes additionally restrict this experimental auth lane to the two
# reviewed installed arm64 images. They supplement vendor trust; they do not
# establish full-file integrity. New CLI releases need a reviewed pin update.

